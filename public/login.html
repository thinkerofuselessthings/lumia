<script>
const $ = (s) => document.querySelector(s);
let loginStep = "user";
let errorTimer = null;

function showError(msg) {
  clearError();
  const el = $("#login-error");
  $("#login-error-text").textContent = msg;
  el.classList.remove("hidden", "is-fading");
  errorTimer = setTimeout(() => {
    el.classList.add("is-fading");
    setTimeout(() => { el.classList.add("hidden"); el.classList.remove("is-fading"); }, 400);
  }, 4000);
}

function clearError() {
  if (errorTimer) { clearTimeout(errorTimer); errorTimer = null; }
  const el = $("#login-error");
  el.classList.add("hidden");
  el.classList.remove("is-fading");
}

function showLoader() { $("#login-loader").classList.remove("hidden"); }
function hideLoader() { $("#login-loader").classList.add("hidden"); }
const MIN_LOADER = 2000;
const delay = (ms) => new Promise(r => setTimeout(r, ms));

async function apiPost(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin",
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "Errore");
  return data;
}

async function handleStep1() {
  const username = $("#login-user").value.trim();
  if (!username) return;
  clearError();
  try {
    const res = await apiPost("/api/auth/check-user", { username });
    if (!res.exists) { showError("Utente non trovato"); return; }
    loginStep = "pass";
    $("#login-user").readOnly = true;
    const passField = $("#login-step-pass");
    passField.classList.remove("hidden");
    passField.style.animation = "loginSlideDown 0.25s ease";
    $("#login-pass").focus();
  } catch (err) {
    showError(err.message || "Errore di connessione");
  }
}

async function handleStep2() {
  const username = $("#login-user").value.trim();
  const password = $("#login-pass").value;
  if (!password) return;
  clearError();
  showLoader();
  const t0 = Date.now();
  try {
    await apiPost("/api/auth/login", { username, password });
    const wait = MIN_LOADER - (Date.now() - t0);
    if (wait > 0) await delay(wait);
    window.location.replace("/");
  } catch (err) {
    const wait = MIN_LOADER - (Date.now() - t0);
    if (wait > 0) await delay(wait);
    hideLoader();
    showError(err.message || "Credenziali non valide");
  }
}

$("#login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (loginStep === "user") handleStep1();
  else handleStep2();
});

// Toggle password visibility
$("#toggle-pass").addEventListener("click", function() {
  const passInput = $("#login-pass");
  const isVisible = passInput.type === "text";
  passInput.type = isVisible ? "password" : "text";
  this.classList.toggle("is-active", !isVisible);
  passInput.focus();
});

// If already authenticated (and not coming from logout), go straight to app
if (!new URLSearchParams(window.location.search).has("logout")) {
  fetch("/api/auth/check", { credentials: "same-origin" })
    .then(r => { if (r.ok) window.location.replace("/"); })
    .catch(() => {});
}

$("#login-user").focus();
</script>

</body>
</html>
